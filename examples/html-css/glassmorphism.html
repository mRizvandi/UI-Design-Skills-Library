<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glassmorphism specimen</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; }
* { box-sizing: border-box; }
body {
  min-height: 100vh; margin: 0; padding: 2rem;
  display: grid; place-items: center; color: white;
  background: radial-gradient(circle at 15% 20%, #ec4899, transparent 35%),
              radial-gradient(circle at 85% 80%, #06b6d4, transparent 38%),
              linear-gradient(135deg, #172554, #312e81);
}
.panel {
  width: min(100%, 34rem); padding: 2rem; border-radius: 1.25rem;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.3);
  box-shadow: 0 1.25rem 3rem rgba(0,0,0,.22);
  -webkit-backdrop-filter: blur(1rem) saturate(140%);
  backdrop-filter: blur(1rem) saturate(140%);
}
button { padding: .7rem 1rem; border: 0; border-radius: .6rem; font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
@supports not (backdrop-filter: blur(1px)) {
  .panel { background: #20264a; }
}
@media (prefers-reduced-transparency: reduce) {
  .panel { background: #20264a; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
</style>
</head>
<body>
<main class="panel">
  <h1>Glassmorphism</h1>
  <p>A small, original specimen: translucent surface, visible colorful backdrop, fine edge, and layered depth.</p>
  <button type="button">Explore styles</button>
</main>
</body>
</html>
